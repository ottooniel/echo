<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <link rel="icon" href="data:,">
  <title>ECHO</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  const ARENA = 400;
  const DT = 1 / 60;
  const MAX_ACCUM = 0.1;
  const MAX_SPEED = 220;
  const PLAYER_R = 7;
  const ORB_R = 9;
  const JOYSTICK_R = 48;
  const MARGIN = 28;
  const ECHO_R = 7;
  const RESTART_TICKS = 30;
  const NEON = ["#22e6ff", "#ff3dc8", "#b8ff2e", "#ff8a1a"];
  const MODES = [
    { name: "FÁCIL", loop: false, grace: 90, orbBonus: 0 },
    { name: "NORMAL", loop: true, grace: 90, orbBonus: 0 },
    { name: "INFIERNO", loop: true, grace: 60, orbBonus: 2 }
  ];
  let mode = 1;

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");

  let viewW = 0;
  let viewH = 0;
  let dpr = 1;
  let scale = 1;
  let ox = 0;
  let oy = 0;

  const keys = Object.create(null);
  let mouseWorldX = ARENA / 2;
  let mouseWorldY = ARENA / 2;
  let mouseSeen = false, anchorX = NaN, anchorY = 0;

  let stickId = null;
  let stickOriginX = 0;
  let stickOriginY = 0;
  let stickNowX = 0;
  let stickNowY = 0;

  const player = {
    x: ARENA / 2,
    y: ARENA / 2,
    px: ARENA / 2,
    py: ARENA / 2
  };

  let round = 1;
  let orbs = [];
  let orbsThisRound = 0;
  let orbsTotal = 0;
  let roundsCompleted = 0;
  let currentPath = [];
  let echoes = [];
  let dead = false;
  let deadTicks = 0;
  let started = false;
  let newBest = false;
  let best = { r: 0, o: 0 }, copiedUntil = 0, shareArmed = false, modeArmed = false;

  let lastTime = 0;
  let accum = 0;

  const trail = [];
  const parts = [];
  let visOrbs = 0, visRound = 1, visDead = false, visPathLen = 0;
  let shakeUntil = 0, flashUntil = 0, graceFlashUntil = 0, bannerUntil = 0, fxPrev = 0;
  let ac, master, noiseBuf, muted = false, orbInRound = 0;
  const drones = [];
  const PENTA = [0, 3, 5, 7, 10, 12, 15, 17, 19, 22];

  function resize() {
    viewW = window.innerWidth;
    viewH = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(viewW * dpr);
    canvas.height = Math.floor(viewH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    scale = Math.min((viewW - 36) / ARENA, (viewH - 68) / ARENA);
    ox = (viewW - ARENA * scale) / 2;
    oy = (viewH - ARENA * scale) / 2;
  }

  function screenToWorld(sx, sy) {
    return {
      x: (sx - ox) / scale,
      y: (sy - oy) / scale
    };
  }

  function worldToScreen(x, y) {
    return {
      x: ox + x * scale,
      y: oy + y * scale
    };
  }

  function orbCountForRound(n) {
    return 3 + (n >> 1) + MODES[mode].orbBonus;
  }

  function echoIndex(path, t) {
    const L = path.length;
    if (!MODES[mode].loop) return t < L ? t : -1;
    if (L < 2) return 0;
    const period = 2 * (L - 1);
    const k = t % period;
    return k < L ? k : period - k;
  }

  function spawnOrbs() {
    orbs = [];
    const need = orbCountForRound(round);
    if (round === 1 || echoes.length === 0) {
      const cx = ARENA / 2;
      const cy = ARENA / 2;
      const radius = 96;
      for (let i = 0; i < need; i++) {
        const a = -Math.PI / 2 + i * (Math.PI * 2 / need);
        orbs.push({
          x: cx + Math.cos(a) * radius,
          y: cy + Math.sin(a) * radius
        });
      }
      return;
    }
    for (let i = 0; i < need; i++) {
      orbs.push(pickOrbOnEcho(i));
    }
  }

  function pickOrbOnEcho(salt) {
    const echo = echoes[salt % echoes.length];
    const path = echo.path;
    const skip = Math.min(MODES[mode].grace, path.length >> 2);
    const span = Math.max(1, path.length - skip);
    for (let attempt = 0; attempt < 12; attempt++) {
      const i = skip + ((Math.random() * span) | 0);
      const p = path[Math.min(i, path.length - 1)];
      const cx = ARENA / 2;
      const cy = ARENA / 2;
      const dxc = p.x - cx;
      const dyc = p.y - cy;
      if (p.x < MARGIN || p.y < MARGIN || p.x > ARENA - MARGIN || p.y > ARENA - MARGIN ||
          dxc * dxc + dyc * dyc < 40 * 40) {
        continue;
      }
      let far = true;
      for (let j = 0; j < orbs.length; j++) {
        const dx = orbs[j].x - p.x;
        const dy = orbs[j].y - p.y;
        if (dx * dx + dy * dy < 40 * 40) {
          far = false;
          break;
        }
      }
      if (far) {
        return { x: p.x, y: p.y };
      }
    }
    const fallback = path[path.length - 1];
    return { x: fallback.x, y: fallback.y };
  }

  function collectOrbs() {
    const reach = PLAYER_R + ORB_R;
    for (let i = orbs.length - 1; i >= 0; i--) {
      const o = orbs[i];
      const dx = o.x - player.x;
      const dy = o.y - player.y;
      if (dx * dx + dy * dy <= reach * reach) {
        orbs.splice(i, 1);
        orbsThisRound += 1;
        orbsTotal += 1;
      }
    }
    if (orbs.length === 0) {
      finishRound();
    }
  }

  function finishRound() {
    echoes.push({
      path: currentPath,
      color: echoes.length % NEON.length
    });
    roundsCompleted += 1;
    round += 1;
    orbsThisRound = 0;
    player.x = ARENA / 2;
    player.y = ARENA / 2;
    player.px = player.x;
    player.py = player.y;
    currentPath = [{ x: player.x, y: player.y }];
    spawnOrbs();
  }

  function resetRun() {
    round = 1;
    orbsThisRound = 0;
    orbsTotal = 0;
    roundsCompleted = 0;
    currentPath = [{ x: ARENA / 2, y: ARENA / 2 }];
    echoes = [];
    dead = false;
    deadTicks = 0;
    stickId = null;
    started = true;
    newBest = false;
    player.x = ARENA / 2;
    player.y = ARENA / 2;
    player.px = player.x;
    player.py = player.y;
    spawnOrbs();
  }

  function bestKey() {
    return mode ? "echo_best" + mode : "echo_best";
  }

  function loadBest() {
    best = { r: 0, o: 0 };
    try {
      const b = JSON.parse(localStorage.getItem(bestKey()));
      if (b && Number.isFinite(b.r) && Number.isFinite(b.o)) best = { r: b.r, o: b.o };
    } catch (err) {}
  }

  function saveBest() {
    newBest = roundsCompleted > best.r || (roundsCompleted === best.r && orbsTotal > best.o);
    if (!newBest) return;
    best = { r: roundsCompleted, o: orbsTotal };
    try { localStorage.setItem(bestKey(), JSON.stringify(best)); } catch (err) {}
  }

  function startWith(m) {
    mode = m;
    try { localStorage.setItem("echo_mode", mode); } catch (err) {}
    loadBest();
    resetRun();
  }

  function clearFx() {
    parts.length = trail.length = 0;
    shakeUntil = flashUntil = graceFlashUntil = bannerUntil = 0;
    orbInRound = 0;
    killDrones();
  }

  function goTitle() {
    started = false;
    dead = false;
    deadTicks = 0;
    visDead = false;
    clearFx();
  }

  function outsideArena() {
    return player.x < PLAYER_R || player.y < PLAYER_R ||
      player.x > ARENA - PLAYER_R || player.y > ARENA - PLAYER_R;
  }

  function hitEcho() {
    if (currentPath.length < MODES[mode].grace) {
      return false;
    }
    const t = currentPath.length - 1;
    const reach = PLAYER_R + ECHO_R;
    const reach2 = reach * reach;
    for (let e = 0; e < echoes.length; e++) {
      const path = echoes[e].path;
      const i = echoIndex(path, t);
      if (i < 0) {
        continue;
      }
      const dx = path[i].x - player.x;
      const dy = path[i].y - player.y;
      if (dx * dx + dy * dy <= reach2) {
        return true;
      }
    }
    return false;
  }

  function keyboardDir() {
    const x = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
    const y = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
    return { x, y };
  }

  function moveToward(tx, ty, dt) {
    const dx = tx - player.x;
    const dy = ty - player.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 0.4) {
      return;
    }
    const step = Math.min(MAX_SPEED * dt, dist);
    player.x += (dx / dist) * step;
    player.y += (dy / dist) * step;
  }

  function moveVelocity(vx, vy, dt) {
    player.x += vx * dt;
    player.y += vy * dt;
  }

  function stickVelocity() {
    const dx = stickNowX - stickOriginX;
    const dy = stickNowY - stickOriginY;
    const len = Math.hypot(dx, dy);
    if (len < 6) {
      return { x: 0, y: 0 };
    }
    const mag = Math.min(1, len / JOYSTICK_R);
    return {
      x: (dx / len) * MAX_SPEED * mag,
      y: (dy / len) * MAX_SPEED * mag
    };
  }

  function step(dt) {
    if (!started) return;
    if (dead) {
      deadTicks += 1;
      return;
    }

    player.px = player.x;
    player.py = player.y;

    const dir = keyboardDir();
    if (dir.x || dir.y) {
      const len = Math.hypot(dir.x, dir.y) || 1;
      moveVelocity((dir.x / len) * MAX_SPEED, (dir.y / len) * MAX_SPEED, dt);
    } else if (stickId !== null) {
      const v = stickVelocity();
      moveVelocity(v.x, v.y, dt);
    } else if (mouseSeen) {
      const tx = Math.max(PLAYER_R, Math.min(ARENA - PLAYER_R, mouseWorldX));
      const ty = Math.max(PLAYER_R, Math.min(ARENA - PLAYER_R, mouseWorldY));
      moveToward(tx, ty, dt);
    }

    currentPath.push({ x: player.x, y: player.y });

    if (outsideArena() || hitEcho()) {
      dead = true;
      deadTicks = 0;
      return;
    }

    collectOrbs();
  }

  function burst(x, y, n, color, spd, now) {
    for (let i = 0; i < n && parts.length < 120; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = spd * (0.35 + Math.random());
      parts.push({
        x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        born: now, life: 260 + Math.random() * 200, color: color, r: 1.6 + Math.random() * 2.2
      });
    }
  }

  function unlock() {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain();
      master.gain.value = 0.4;
      master.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.35, ac.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    }
    if (ac.state === "suspended") ac.resume();
  }

  function tone(freq, dur, type, vol, delay, slideTo) {
    if (!ac) return;
    const t = ac.currentTime + (delay || 0);
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(Math.max(20, freq), t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(master);
    o.start(t);
    o.stop(t + dur + 0.03);
  }

  function noise(dur) {
    if (!ac) return;
    const t = ac.currentTime;
    const src = ac.createBufferSource();
    src.buffer = noiseBuf;
    const f = ac.createBiquadFilter();
    f.type = "lowpass";
    f.frequency.setValueAtTime(1600, t);
    f.frequency.exponentialRampToValueAtTime(180, t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.32, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f);
    f.connect(g);
    g.connect(master);
    src.start(t);
    src.stop(t + dur);
  }

  function killDrones() {
    for (let i = 0; i < drones.length; i++) {
      try { drones[i].o.stop(); } catch (err) {}
      drones[i].o.disconnect();
      drones[i].g.disconnect();
    }
    drones.length = 0;
  }

  function updateDrones() {
    if (!ac || !started) return;
    while (drones.length < echoes.length) {
      const o = ac.createOscillator();
      const f = ac.createBiquadFilter();
      const g = ac.createGain();
      o.type = "sine";
      f.type = "lowpass";
      f.frequency.value = 380;
      g.gain.value = 0;
      o.connect(f);
      f.connect(g);
      g.connect(master);
      o.start();
      drones.push({ o: o, f: f, g: g });
    }
    const t = ac.currentTime;
    const tick = currentPath.length - 1;
    const hush = dead || currentPath.length < MODES[mode].grace;
    for (let e = 0; e < drones.length; e++) {
      let freq = 55, vol = 0;
      const i = e < echoes.length && tick >= 0 ? echoIndex(echoes[e].path, tick) : -1;
      if (!hush && i >= 0) {
        const p = echoes[e].path[i];
        const idx = Math.min(9, Math.max(0, (p.x / ARENA * 10) | 0));
        freq = 55 * Math.pow(2, PENTA[idx] / 12);
        const dist = Math.hypot(p.x - player.x, p.y - player.y);
        vol = 0.03 * (1 - Math.min(1, dist / 220));
      }
      drones[e].o.frequency.setTargetAtTime(freq, t, 0.06);
      drones[e].g.gain.setTargetAtTime(vol, t, 0.05);
    }
  }

  function echoHitColor() {
    const tick = currentPath.length - 1;
    const r2 = (PLAYER_R + ECHO_R) * (PLAYER_R + ECHO_R);
    for (let e = 0; e < echoes.length; e++) {
      const path = echoes[e].path;
      const i = echoIndex(path, tick);
      if (i < 0) continue;
      const dx = path[i].x - player.x;
      const dy = path[i].y - player.y;
      if (dx * dx + dy * dy <= r2) return NEON[echoes[e].color];
    }
    return "#fff";
  }

  function syncFx(now) {
    if (orbsTotal > visOrbs) {
      let bx = player.x, by = player.y;
      if (round !== visRound && echoes.length) {
        const last = echoes[echoes.length - 1].path;
        const p = last[last.length - 1];
        bx = p.x;
        by = p.y;
      }
      for (let i = 0; i < orbsTotal - visOrbs; i++) {
        burst(bx, by, 10, "#ffd24a", 90, now);
        tone(Math.min(1400, 520 + orbInRound * 70), 0.08, "square", 0.11);
        orbInRound += 1;
      }
    }
    if (round !== visRound) {
      trail.length = 0;
      orbInRound = 0;
      if (round > visRound) {
        flashUntil = now + 120;
        bannerUntil = now + 1200;
        const arp = [523, 659, 784, 1047];
        for (let n = 0; n < 4; n++) tone(arp[n], 0.09, "triangle", 0.1, n * 0.07);
      }
    }
    if (dead && !visDead) {
      burst(player.x, player.y, 16, "#fff", 140, now);
      burst(player.x, player.y, 10, echoHitColor(), 120, now);
      shakeUntil = now + 200;
      noise(0.28);
      tone(140, 0.42, "sine", 0.2, 0, 40);
      saveBest();
    }
    if (!dead && visDead) clearFx();
    if (visPathLen < MODES[mode].grace && currentPath.length >= MODES[mode].grace && echoes.length) {
      graceFlashUntil = now + 180;
      tone(1800, 0.045, "square", 0.045);
    }
    updateDrones();
    visOrbs = orbsTotal; visRound = round; visDead = dead; visPathLen = currentPath.length;
  }

  function echoOpacity(index, now) {
    const a = 1 - (echoes.length - 1 - index) * 0.12;
    const inGrace = currentPath.length < MODES[mode].grace;
    let o = Math.max(0.5, inGrace ? Math.min(a, 0.55) : a);
    if (inGrace) o = Math.max(0.5, o * (0.78 + 0.22 * (0.5 + 0.5 * Math.sin(now * 0.012))));
    if (now < graceFlashUntil) o = Math.min(1, o + 0.45);
    return o;
  }

  function echoPos(path, alpha) {
    const t = currentPath.length - 1;
    if (t < 0) return null;
    const i = echoIndex(path, t);
    if (i < 0) return null;
    if (!t) return path[i];
    const j = echoIndex(path, t - 1);
    const a = path[i];
    const b = path[j < 0 ? i : j];
    return { x: b.x + (a.x - b.x) * alpha, y: b.y + (a.y - b.y) * alpha };
  }

  function strokePath(path, from) {
    let s = worldToScreen(path[from].x, path[from].y);
    ctx.moveTo(s.x, s.y);
    for (let i = from + 3; i < path.length; i += 3) {
      s = worldToScreen(path[i].x, path[i].y);
      ctx.lineTo(s.x, s.y);
    }
    s = worldToScreen(path[path.length - 1].x, path[path.length - 1].y);
    ctx.lineTo(s.x, s.y);
  }

  function drawEchoRoutes() {
    ctx.lineWidth = 1.4;
    for (let e = 0; e < echoes.length; e++) {
      const path = echoes[e].path;
      if (!path.length) continue;
      const loop = MODES[mode].loop;
      const i0 = loop ? 0 : currentPath.length - 1;
      if (!loop && (i0 < 0 || echoIndex(path, i0) < 0)) continue;
      ctx.globalAlpha = loop ? 0.08 : 0.12;
      ctx.strokeStyle = NEON[echoes[e].color];
      ctx.beginPath();
      strokePath(path, i0);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function dot(x, y, r, stroke) {
    const s = worldToScreen(x, y);
    ctx.beginPath();
    ctx.arc(s.x, s.y, r * scale, 0, Math.PI * 2);
    stroke ? ctx.stroke() : ctx.fill();
  }

  function drawEchoes(alpha, now) {
    const t = currentPath.length - 1;
    for (let e = 0; e < echoes.length; e++) {
      const path = echoes[e].path;
      const pos = echoPos(path, alpha);
      if (!pos) continue;
      const op = echoOpacity(e, now);
      ctx.shadowColor = ctx.fillStyle = NEON[echoes[e].color];
      ctx.shadowBlur = 0;
      for (let k = 5; k; k--) {
        const i = t < k * 3 ? -1 : echoIndex(path, t - k * 3);
        if (i < 0) continue;
        ctx.globalAlpha = op * (0.36 - k * 0.06);
        dot(path[i].x, path[i].y, ECHO_R * (1 - k * 0.12));
      }
      ctx.globalAlpha = op;
      ctx.shadowBlur = echoes.length > 6 ? 4 : 12;
      dot(pos.x, pos.y, ECHO_R);
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  function drawOrbs(now) {
    const pulse = 0.5 + 0.5 * Math.sin(now * 0.006);
    ctx.fillStyle = "#ffd24a";
    ctx.shadowColor = "#ffd24a";
    ctx.shadowBlur = 6 + pulse * 6;
    for (let i = 0; i < orbs.length; i++) dot(orbs[i].x, orbs[i].y, ORB_R + pulse * 2.2);
    ctx.shadowBlur = 0;
  }

  function playerDrawPos(alpha) {
    return { x: player.px + (player.x - player.px) * alpha, y: player.py + (player.y - player.py) * alpha };
  }

  function drawTrail(now) {
    ctx.fillStyle = "#fff";
    for (let i = 0; i < trail.length; i++) {
      const p = trail[i];
      const k = 1 - (now - p.t) / 220;
      if (k <= 0) continue;
      ctx.globalAlpha = k * 0.35;
      dot(p.x, p.y, PLAYER_R * (0.25 + k * 0.7));
    }
    ctx.globalAlpha = 1;
  }

  function drawPlayer(alpha) {
    const p = playerDrawPos(alpha);
    ctx.shadowColor = "#fff";
    ctx.shadowBlur = 12;
    ctx.fillStyle = "#fff";
    dot(p.x, p.y, PLAYER_R);
    ctx.shadowBlur = 0;
  }

  function drawGraceRing(alpha, now) {
    const g = MODES[mode].grace;
    const left = g - currentPath.length;
    if (left <= 0 || dead || !echoes.length) return;
    const p = playerDrawPos(alpha);
    ctx.strokeStyle = "rgba(255,255,255," + (0.25 + 0.2 * (0.5 + 0.5 * Math.sin(now * 0.01))) + ")";
    ctx.lineWidth = 2;
    dot(p.x, p.y, left / g * 38, 1);
  }

  function drawParts(now, dt) {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      const age = now - p.born;
      if (age >= p.life) { parts.splice(i, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.96;
      p.vy *= 0.96;
      const k = 1 - age / p.life;
      ctx.globalAlpha = k;
      ctx.fillStyle = p.color;
      dot(p.x, p.y, p.r * (0.4 + k));
    }
    ctx.globalAlpha = 1;
  }

  function drawLabels(alpha, now) {
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    if (now < bannerUntil) {
      ctx.globalAlpha = Math.min(1, (bannerUntil - now) / 300);
      ctx.fillStyle = "#fff";
      ctx.font = "28px monospace";
      ctx.fillText("RONDA " + round, viewW / 2, oy + 90 * scale);
    }
    const left = 240 - currentPath.length;
    const p = echoes.length === 1 && !dead && left > 0 && echoPos(echoes[0].path, alpha);
    if (p) {
      const s = worldToScreen(p.x, p.y - 17);
      ctx.globalAlpha = Math.min(1, left / 30);
      ctx.fillStyle = NEON[0];
      ctx.font = "14px monospace";
      ctx.fillText("TU ECO", s.x, s.y);
    }
    ctx.globalAlpha = 1;
  }

  function drawStick() {
    if (stickId === null) {
      return;
    }
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,0.14)";
    ctx.fillStyle = "rgba(255,255,255,0.38)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(stickOriginX, stickOriginY, JOYSTICK_R, 0, Math.PI * 2);
    ctx.stroke();
    const dx = stickNowX - stickOriginX;
    const dy = stickNowY - stickOriginY;
    const len = Math.hypot(dx, dy);
    const cap = Math.min(len, JOYSTICK_R);
    const kx = stickOriginX + (len > 0 ? dx / len * cap : 0);
    const ky = stickOriginY + (len > 0 ? dy / len * cap : 0);
    ctx.beginPath();
    ctx.arc(kx, ky, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawTitle(now) {
    const cx = ARENA / 2, cy = ARENA / 2;
    for (let i = 0; i < 3; i++) {
      const a = now * 0.0007 + i * 2.1;
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = NEON[i];
      dot(cx + Math.cos(a) * 135, cy + Math.sin(a) * 120, ECHO_R);
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "64px monospace";
    ctx.fillText("ECHO", viewW / 2, viewH / 2 - 40);
    ctx.font = "16px monospace";
    ctx.fillText("MEJOR  R" + best.r + "  " + best.o, viewW / 2, viewH / 2 + 8);
    ctx.font = "18px monospace";
    ctx.fillText("toca para jugar", viewW / 2, viewH / 2 + 32);
    ctx.font = "16px monospace";
    for (let i = 0; i < 3; i++) {
      const lab = (i + 1) + " " + MODES[i].name;
      ctx.fillText(mode === i ? "[ " + lab + " ]" : lab, viewW / 2, viewH / 2 + 62 + i * 26);
    }
    ctx.font = "12px monospace";
    ctx.fillText("recoge los orbes · esquiva tus ecos", viewW / 2, viewH / 2 + 144);
    if (!matchMedia("(pointer: coarse)").matches) ctx.fillText("M: sonido", viewW / 2, viewH / 2 + 162);
  }

  function hitModeLine(x, y) {
    if (Math.abs(x - viewW / 2) > 110) return -1;
    for (let i = 0; i < 3; i++) {
      if (Math.abs(y - (viewH / 2 + 62 + i * 26)) < 20) return i;
    }
    return -1;
  }

  function drawHud() {
    const need = orbCountForRound(round);
    ctx.fillStyle = "#fff"; ctx.font = "16px monospace";
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.fillText("ECHO · " + MODES[mode].name + "  R" + round + "  " + orbsThisRound + "/" + need, ox, Math.max(8, oy - 24));
    if (muted) {
      ctx.textAlign = "right";
      ctx.fillText("MUTE", ox + ARENA * scale, Math.max(8, oy - 24));
    }
    if (dead) {
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = "52px monospace";
      ctx.fillText("FIN", viewW / 2, viewH / 2 - 36);
      ctx.font = "18px monospace";
      ctx.fillText("R" + roundsCompleted + "  " + orbsTotal, viewW / 2, viewH / 2 + 8);
      if (newBest) {
        ctx.font = "16px monospace";
        ctx.fillText("NUEVO RÉCORD", viewW / 2, viewH / 2 + 32);
      }
      ctx.font = "14px monospace";
      ctx.fillText("MEJOR  R" + best.r + "  " + best.o, viewW / 2, viewH / 2 + (newBest ? 54 : 34));
      ctx.fillText("toca para reiniciar", viewW / 2, viewH / 2 + (newBest ? 76 : 56));
      ctx.font = "12px monospace";
      ctx.textAlign = "right";
      ctx.textBaseline = "bottom";
      ctx.fillText(performance.now() < copiedUntil ? "copiado" : "compartir", ox + ARENA * scale - 12, oy + ARENA * scale - 18);
      ctx.textAlign = "left";
      ctx.fillText("cambiar modo", ox + 12, oy + ARENA * scale - 18);
    }
  }

  function hitCorner(x, y, left) {
    return Math.abs(x - (left ? ox + 48 : ox + ARENA * scale - 48)) < 60 &&
      Math.abs(y - (oy + ARENA * scale - 18)) < 22;
  }

  function shareScore() {
    const t = "ECHO · " + MODES[mode].name + " · R" + roundsCompleted + " · " + orbsTotal + " orbes. ¿Me superas? " + location.href;
    try {
      if (window.matchMedia("(pointer: coarse)").matches && navigator.share) {
        navigator.share({ text: t }).catch(function () {});
        return;
      }
      navigator.clipboard.writeText(t).then(function () { copiedUntil = performance.now() + 1500; }).catch(function () {});
    } catch (err) {}
  }

  function draw(alpha, now) {
    if (dead) alpha = 1;
    const dt = fxPrev ? Math.min(0.05, (now - fxPrev) / 1000) : DT;
    fxPrev = now;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, viewW, viewH);
    ctx.save();
    if (now < shakeUntil) {
      const k = (shakeUntil - now) / 200;
      ctx.translate((Math.random() - 0.5) * 14 * k, (Math.random() - 0.5) * 14 * k);
    }
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
    ctx.strokeRect(ox, oy, ARENA * scale, ARENA * scale);
    if (!started) {
      ctx.restore();
      drawTitle(now);
      return;
    }
    drawEchoRoutes();
    drawTrail(now);
    drawEchoes(alpha, now);
    drawOrbs(now);
    if (!dead) {
      const p = playerDrawPos(alpha);
      trail.push({ x: p.x, y: p.y, t: now });
      while (trail.length && now - trail[0].t > 220) trail.shift();
      drawPlayer(alpha);
      drawGraceRing(alpha, now);
    }
    drawParts(now, dt);
    ctx.restore();
    if (now < flashUntil) {
      ctx.fillStyle = "rgba(255,255,255," + ((flashUntil - now) / 120 * 0.55) + ")";
      ctx.fillRect(0, 0, viewW, viewH);
    }
    drawLabels(alpha, now);
    drawStick();
    drawHud();
  }

  function applyPointerControl(e) {
    if (e.pointerType === "touch") {
      stickId = e.pointerId;
      stickOriginX = e.clientX;
      stickOriginY = e.clientY;
      stickNowX = e.clientX;
      stickNowY = e.clientY;
      return;
    }
    mouseSeen = true;
    const w = screenToWorld(e.clientX, e.clientY);
    mouseWorldX = w.x;
    mouseWorldY = w.y;
  }

  function onPointerDown(e) {
    e.preventDefault();
    unlock();
    if (!started) {
      const mi = hitModeLine(e.clientX, e.clientY);
      startWith(mi >= 0 ? mi : mode);
      applyPointerControl(e);
      return;
    }
    if (dead) {
      if (hitCorner(e.clientX, e.clientY, 0)) { shareArmed = true; return; }
      if (hitCorner(e.clientX, e.clientY, 1)) { modeArmed = true; return; }
      if (deadTicks < RESTART_TICKS) return;
      resetRun();
      applyPointerControl(e);
      return;
    }
    if (e.pointerType === "touch" && stickId !== null) return;
    applyPointerControl(e);
  }

  function onPointerMove(e) {
    e.preventDefault();
    if (!started) return;
    if (e.pointerType === "touch") {
      if (e.pointerId !== stickId) {
        return;
      }
      stickNowX = e.clientX;
      stickNowY = e.clientY;
      return;
    }
    if (!mouseSeen) {
      if (anchorX !== anchorX) { anchorX = e.clientX; anchorY = e.clientY; }
      if (Math.hypot(e.clientX - anchorX, e.clientY - anchorY) < 40) return;
    }
    mouseSeen = true;
    const w = screenToWorld(e.clientX, e.clientY);
    mouseWorldX = w.x;
    mouseWorldY = w.y;
  }

  function onPointerUp(e) {
    unlock();
    if (shareArmed) {
      if (e.type !== "pointercancel" && dead && hitCorner(e.clientX, e.clientY, 0)) shareScore();
      shareArmed = false;
    }
    if (modeArmed) {
      if (e.type !== "pointercancel" && hitCorner(e.clientX, e.clientY, 1)) goTitle();
      modeArmed = false;
    }
    if (e.pointerId === stickId) {
      stickId = null;
    }
  }

  function isStartKey(k) {
    return /^(Enter|Space|Arrow|Key[WASD]$)/.test(k);
  }

  function onKey(e, down) {
    if (down) unlock();
    if (down && !e.repeat && e.key === "Escape" && started) { goTitle(); return; }
    if (down && !e.repeat && dead && (e.key === "c" || e.key === "C")) { shareScore(); return; }
    if (down && (e.key === "m" || e.key === "M")) {
      if (!e.repeat && master) {
        muted = !muted;
        master.gain.setTargetAtTime(muted ? 0 : 0.4, ac.currentTime, 0.03);
      }
      return;
    }
    if (down && e.repeat) {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].indexOf(e.key) !== -1) {
        e.preventDefault();
      }
      return;
    }
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].indexOf(e.key) !== -1) {
      e.preventDefault();
    }
    if (down && isStartKey(e.code)) { mouseSeen = false; anchorX = NaN; }
    if (down && !started) {
      if (e.key === "1" || e.key === "2" || e.key === "3") {
        startWith(e.key - 1);
        return;
      }
      if (!isStartKey(e.code)) return;
      keys[e.code] = true;
      startWith(mode);
      return;
    }
    keys[e.code] = down;
    if (down && dead && deadTicks >= RESTART_TICKS && isStartKey(e.code)) {
      resetRun();
    }
  }

  function frame(now) {
    if (!lastTime) {
      lastTime = now;
    }
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    accum += dt;
    if (accum > MAX_ACCUM) {
      accum = MAX_ACCUM;
    }
    while (accum >= DT) {
      step(DT);
      accum -= DT;
    }
    syncFx(now);
    draw(accum / DT, now);
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", resize);
  window.addEventListener("pointerdown", onPointerDown, { passive: false });
  window.addEventListener("pointermove", onPointerMove, { passive: false });
  window.addEventListener("pointerup", onPointerUp);
  window.addEventListener("pointercancel", onPointerUp);
  window.addEventListener("keydown", function (e) { onKey(e, true); });
  window.addEventListener("keyup", function (e) { onKey(e, false); });
  window.addEventListener("blur", function () {
    for (const k in keys) {
      keys[k] = false;
    }
  });
  document.addEventListener("visibilitychange", function () {
    if (!ac) return;
    if (document.hidden) ac.suspend();
    else ac.resume();
  });

  resize();
  try {
    const n = localStorage.getItem("echo_mode");
    if (n === "0" || n === "1" || n === "2") mode = +n;
  } catch (err) {}
  loadBest();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
